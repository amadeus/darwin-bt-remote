name: BTRemote
options:
  bundleIdPrefix: io.github.jqssun
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: UHD99KF9X7
    MARKETING_VERSION: "0.0.4"
    CURRENT_PROJECT_VERSION: "4"

targets:
  BTRemote:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: BTRemote
        excludes:
          - entitlements.plist
      - path: BTRemote/entitlements.plist
        buildPhase: none
    resources:
      - BTRemote/Assets.xcassets
      - BTRemote/PrivacyInfo.xcprivacy
      - BTRemote/Resources/company_ids.json
      - BTRemote/Resources/service_uuids.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jqssun.btremote
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BTRemote/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": BTRemote/entitlements.plist
  BTRemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BTRemoteTests
      - BTRemote/LowEnergy/HIDReports.swift
      - BTRemote/EdgeGeometry.swift
      - BTRemote/HandoffState.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jqssun.btremote.tests
schemes:
  BTRemote:
    build:
      targets:
        BTRemote: all
    test:
      targets:
        - BTRemoteTests
    run:
      config: Debug
    archive:
      config: Release
